<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de mecánica - Juego de ritmo</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
  <script src="menu.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Demo de ritmo">RITMO<span>///</span></a>
      <h1 class="page-title">INTERFAZ TEMPORAL</h1>
    </header>

    <section class="start-screen" id="startScreen" aria-label="Menú de inicio">
      <div class="start-card" id="mainMenu">
        <h2>INTERFAZ TEMPORAL</h2>
        <nav class="start-menu-buttons" aria-label="Menú principal">
          <button id="startButton" type="button">STORY MODE</button>
          <button id="practiceButton" type="button">PRÁCTICA</button>
          <button id="creditsButton" type="button">CRÉDITOS</button>
          <button id="openSettingsButton" type="button">CONFIGURACIÓN</button>
        </nav>
      </div>
      <div class="story-intro" id="storyIntro" aria-live="polite" hidden>
        <p id="storySceneLabel" class="story-scene-label"></p>
        <h2 id="storySceneTitle"></h2>
        <p id="storySceneText"></p>
        <button id="skipStoryIntro" class="story-skip" type="button">SALTAR INTRO ▶</button>
      </div>
      <div class="start-card credits-panel" id="creditsPanel" hidden>
        <p class="start-eyebrow">RITMO ///</p>
        <h2>CRÉDITOS</h2>
        <p>Demo web de juego musical con cuatro carriles.</p>
        <p>Proyecto: Prueba de mecánica.</p>
        <button id="backFromCredits" class="credits-back" type="button">VOLVER</button>
      </div>
      <section class="settings-screen" id="settingsScreen" aria-label="Configuración" hidden>
        <header class="settings-header">
          <button id="backFromSettings" class="settings-back" type="button">← VOLVER</button>
          <h2>CONFIGURACIÓN</h2>
        </header>
        <div class="settings-content">
          <label class="option-label volume-label" for="volumeControl"><span>VOLUMEN DE EFECTOS</span><output id="volumeValue" for="volumeControl">20%</output></label>
          <input id="volumeControl" class="volume-control" type="range" min="0" max="100" value="20">

          <label class="option-label" for="difficulty">VELOCIDAD DE LAS NOTAS</label>
          <select id="difficulty" class="difficulty">
            <option value="2600">Lenta</option>
            <option value="1800" selected>Normal</option>
            <option value="1100">Rápida</option>
          </select>

          <section class="menu-game-controls" aria-label="Control de partida">
            <h3>PARTIDA</h3>
            <div class="controls"><button id="resetButton" class="secondary" type="button">↺ &nbsp; REINICIAR</button></div>
          </section>

          <div class="file-controls">
            <label class="file-label" for="chartFile">MAPA DE NOTAS JSON <span>cargar otro mapa</span></label>
            <input id="chartFile" type="file" accept="application/json,.json">
          </div>

          <section class="key-settings" aria-label="Asignación de teclas">
            <strong>ASIGNAR TECLAS</strong>
            <div class="key-row"><span>Carril 1</span><button type="button" class="key-bind" data-bind-lane="0">←</button></div>
            <div class="key-row"><span>Carril 2</span><button type="button" class="key-bind" data-bind-lane="1">↓</button></div>
            <div class="key-row"><span>Carril 3</span><button type="button" class="key-bind" data-bind-lane="2">↑</button></div>
            <div class="key-row"><span>Carril 4</span><button type="button" class="key-bind" data-bind-lane="3">→</button></div>
            <button id="defaultKeys" type="button" class="default-keys">Restaurar flechas</button>
          </section>
        </div>
      </section>
    </section>

    <section class="game-main">
      <div class="concert-lights" aria-hidden="true"></div>
      <section class="scoreboard visually-hidden" aria-label="Estado de la partida">
        <div id="feedback" class="feedback" aria-live="polite">LISTO</div>
      </section>

      <section class="game-card" aria-label="Pista de juego">
        <span id="clock" class="visually-hidden">00:00</span>
        <div class="stage" id="stage">
          <div class="highway" id="highway" aria-label="Pista de cuatro carriles">
            <div class="lane-glow"></div>
            <div class="hit-line"></div>
            <div class="receptors">
              <div class="receptor" data-lane="0" aria-label="Carril 1: izquierda"><span aria-hidden="true">←</span></div><div class="receptor" data-lane="1" aria-label="Carril 2: abajo"><span aria-hidden="true">↓</span></div>
              <div class="receptor" data-lane="2" aria-label="Carril 3: arriba"><span aria-hidden="true">↑</span></div><div class="receptor" data-lane="3" aria-label="Carril 4: derecha"><span aria-hidden="true">→</span></div>
            </div>
          </div>
          <div id="notes" class="notes"></div>
          <svg class="perspective-lines" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
            <path class="track-border" d="M300 400 H700 M300 400 L20 1000 M700 400 L980 1000 M20 1000 H980" />
            <path class="lane-dividers" d="M400 400 L260 1000 M500 400 V1000 M600 400 L740 1000" />
          </svg>
          <div class="impulse-hud" aria-label="Barra de impulso">
            <div class="boost-meter" role="progressbar" aria-label="Carga de impulso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="boostFill" class="boost-fill"></div>
            </div>
            <span id="boostStatus" class="visually-hidden">0%</span>
          </div>
          <div class="stage-message" id="stageMessage" hidden></div>
        </div>
      </section>

      <section class="power-controls" aria-label="Impulso y controles de partida">
        <div class="boost-hud">
          <div class="score-block points-inline"><span class="stat-label">PUNTOS</span><strong id="score">000000</strong></div>
          <div class="combo-block combo-orb" aria-label="Combo">
            <strong><span id="combo">0</span><span id="comboMultiplier" class="multiplier">x1</span></strong>
          </div>
          <div id="judgementDisplay" class="judgement-display" aria-live="polite"></div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
